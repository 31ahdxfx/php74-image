; 性能参数（加载顺序在 99-bt.ini 之后，优先级更高：99-bt 与 99-zz 按字母序）
; 面向 Laravel/ThinkPHP 类框架的生产调优；与 8.2 容器同款

; ---------- OPcache ----------
; 数值对齐目标机宝塔 php.ini（128M / 80000 files / interned 32），
; 让替换前后的缓存行为一致，便于对比性能与排查
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 80000
; 保留时间戳校验（避免部署后跑旧代码），检查频率与宿主一致 60s
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.max_wasted_percentage = 10

; 7.4 没有 JIT，无需配置 opcache.jit*

; ---------- 文件路径缓存 ----------
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; ---------- 其他 ----------
expose_php = Off

; ---------- 安全默认值（与 php2shell 相关）----------
; 补丁已含 max_multipart_body_parts（默认 -1 = 不限制），此处显式写出便于巡检识别
max_multipart_body_parts = -1
session.upload_progress.enabled = Off
