; PHP 7.4 容器 FPM pool —— 与宝塔 /www/server/php/74/etc/php-fpm.conf 的 [www] 段对齐并调优
; 与 8.2 容器保持同一套规则，只改 socket 名与状态路径，便于同一台机/不同机器统一运维
; 差异说明：
;   1. listen.allowed_clients 仅对 TCP 生效，unix socket 无需
;   2. slowlog 放 /tmp（宿主 /tmp 已挂入容器）
;   3. pm 用 dynamic：避免 ondemand 的冷请求 fork 延迟
;   4. max_requests 回收 worker，防止长跑内存泄漏（7.4 上的框架更明显）

[www]
listen = /tmp/php-cgi-74.sock
listen.backlog = 8192
listen.owner = www
listen.group = www
listen.mode = 0666

user = www
group = www

; ---------- 进程模型 ----------
; 2C2G 机器的保守取值：7.4 上单 worker 常驻约 40-70MB
; 若目标机内存更大，按 (可用内存 * 0.6 / 60MB) 上调 max_children
pm = dynamic
pm.max_children = 16
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
pm.process_idle_timeout = 10s

pm.status_path = /phpfpm_74_status

request_terminate_timeout = 100
request_slowlog_timeout = 30
slowlog = /tmp/php-fpm-74-slow.log

catch_workers_output = yes

; ---------- 安全加固（php2shell 补丁之外的纵深防御）----------
; 补丁已在代码层硬关掉 session 上传进度，这里再从配置层锁死，防止业务目录 .user.ini 改回去
php_admin_flag[session.upload_progress.enabled] = off
; 上传限制与目标机 php.ini 保持一致（50M），避免 99-bt.ini 被覆盖成不同值
php_admin_value[post_max_size] = 50M
php_admin_value[upload_max_filesize] = 50M
; 禁止通过 .user.ini 覆盖上面的安全项
php_admin_value[user_ini.filename] = ""
