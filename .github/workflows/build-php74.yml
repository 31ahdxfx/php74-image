name: Build PHP 7.4.34 (php2shell patched)

# 用途：在 GitHub 的 x86_64 runner 上构建已修复 CVE-2026-109618 / CVE-2026-109619
#       的 PHP 7.4 FPM 镜像，不占用生产服务器资源。
# 产物：① ghcr.io/<owner>/php74-fpm:7.4.34（可直接 docker pull）
#       ② Actions artifact（离线 tar.gz，供无外网/拉取受限的机器 docker load）

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: '推送到 ghcr.io'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'conf/**'
      - '.github/workflows/build-php74.yml'

env:
  IMAGE_NAME: php74-fpm
  PHP_VERSION: 7.4.34

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 释放 runner 磁盘（编译 PHP 需要约 4GB）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune -af || true
          df -h /

      - name: 校验补丁（段数 / 指纹 / 哈希）
        run: |
          set -eu
          P=conf/7.4-cve-2026-109618-109619.patch
          test -s "$P" || { echo "补丁文件缺失"; exit 1; }
          CNT=$(grep -c '^diff --git' "$P")
          echo "diff 段数: $CNT (期望 19)"
          test "$CNT" = "19" || { echo "补丁段数异常，可能被篡改"; exit 1; }
          for k in zend_mm_safe_error_ex max_multipart_body_parts '|| true'; do
            grep -q -- "$k" "$P" || { echo "缺少特征: $k"; exit 1; }
          done
          echo "sha256: $(sha256sum "$P" | awk '{print $1}')"
          echo "补丁校验通过"

      - name: 构建镜像
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          docker build -t ${IMAGE_NAME}:${PHP_VERSION} . 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]:-$?}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 构建失败时把日志回写仓库（便于无 token 排查）
        if: steps.build.outcome == 'failure'
        run: |
          set -e
          {
            echo "# 构建失败日志"
            echo ""
            echo "- run: ${{ github.run_id }}"
            echo "- sha: ${{ github.sha }}"
            echo "- time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo '```'
            tail -c 120000 /tmp/build.log 2>/dev/null || echo "(no log)"
            echo '```'
          } > build-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-failure.log
          git commit -m "ci: record build failure log [skip ci]" || exit 0
          git push || true

      - name: 构建失败则终止作业
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::docker build 失败，详细日志见仓库根目录 build-failure.log"
          exit 1

      - name: 构建成功确认
        if: steps.build.outcome == 'success'
        run: docker images | grep ${IMAGE_NAME}

      - name: 验证补丁确实进了二进制（关键门禁）
        run: |
          set -eu
          echo "--- 版本 ---"
          docker run --rm ${IMAGE_NAME}:${PHP_VERSION} php -v
          echo "--- 补丁指纹 ---"
          VAL=$(docker run --rm ${IMAGE_NAME}:${PHP_VERSION} php -r 'echo ini_get("max_multipart_body_parts");')
          echo "max_multipart_body_parts = [$VAL]"
          if [ "$VAL" != "-1" ]; then
            echo "::error::补丁未生效，ini_get 返回 [$VAL]，应为 -1"
            exit 1
          fi
          echo "--- PHP_VERSION 环境变量（应与 php -v 一致）---"
          ENVV=$(docker inspect ${IMAGE_NAME}:${PHP_VERSION} --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^PHP_VERSION=//p')
          echo "ENV PHP_VERSION = [$ENVV]"
          if [ "$ENVV" != "${PHP_VERSION}" ]; then
            echo "::error::镜像 ENV PHP_VERSION=[$ENVV] 与期望 [${PHP_VERSION}] 不一致"
            exit 1
          fi
          echo "--- 运行时 PHP_VERSION（这才是 php -v 真正显示的）---"
          RUNV=$(docker run --rm ${IMAGE_NAME}:${PHP_VERSION} php -r 'echo PHP_VERSION;')
          echo "php -r 'echo PHP_VERSION' = [$RUNV]"
          if [ "$RUNV" != "${PHP_VERSION}" ]; then
            echo "::error::运行时 PHP_VERSION=[$RUNV] 与期望 [${PHP_VERSION}] 不一致（php_version.h 可能被 configure 覆盖）"
            exit 1
          fi
          echo "--- 扩展清单 ---"
          docker run --rm ${IMAGE_NAME}:${PHP_VERSION} php -m

      - name: 冒烟测试（容器能否稳定常驻）
        run: |
          set -eu
          docker rm -f smoke >/dev/null 2>&1 || true
          docker run -d --name smoke -v /tmp:/tmp ${IMAGE_NAME}:${PHP_VERSION}
          sleep 8
          STATUS=$(docker inspect -f '{{.State.Status}}' smoke)
          echo "容器状态: $STATUS"
          if [ "$STATUS" != "running" ]; then
            echo "::error::容器未能常驻（状态 $STATUS），常见原因是 php-fpm daemonize 未关闭导致主进程退出"
            docker logs smoke 2>&1 | tail -20
            exit 1
          fi
          echo "--- socket 是否生成 ---"
          docker exec smoke ls -l /tmp/php-cgi-74.sock
          echo "--- FPM 进程 ---"
          docker exec smoke ps aux 2>/dev/null | grep -c '[p]hp-fpm' || true
          docker rm -f smoke >/dev/null 2>&1 || true
          echo "冒烟测试通过"

      - name: 登录 ghcr.io
        if: github.event.inputs.push_image != 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送到 ghcr.io
        if: github.event.inputs.push_image != 'false'
        run: |
          set -eu
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMG=ghcr.io/$OWNER/${IMAGE_NAME}:${PHP_VERSION}
          docker tag ${IMAGE_NAME}:${PHP_VERSION} "$IMG"
          docker push "$IMG"
          {
            echo "### 镜像已推送"
            echo ""
            echo '```'
            echo "$IMG"
            echo '```'
            echo ""
            echo "各机拉取：\`docker pull $IMG\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 导出离线包
        run: |
          set -eux
          docker save ${IMAGE_NAME}:${PHP_VERSION} | gzip -1 > ${IMAGE_NAME}-${PHP_VERSION}.tar.gz
          ls -lh ${IMAGE_NAME}-${PHP_VERSION}.tar.gz

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: php74-fpm-${{ env.PHP_VERSION }}
          path: php74-fpm-${{ env.PHP_VERSION }}.tar.gz
          retention-days: 30
          compression-level: 0

      - name: 汇总
        run: |
          {
            echo "### 构建结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| PHP 版本 | $(docker run --rm ${IMAGE_NAME}:${PHP_VERSION} php -r 'echo PHP_VERSION;') |"
            echo "| 补丁指纹 | $(docker run --rm ${IMAGE_NAME}:${PHP_VERSION} php -r 'echo ini_get("max_multipart_body_parts");') |"
            echo "| 镜像大小 | $(docker image inspect ${IMAGE_NAME}:${PHP_VERSION} --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1024/1024}') |"
          } >> "$GITHUB_STEP_SUMMARY"
